name: Developer Studio V22 CSharp .NET acceptance

on:
  pull_request:
    paths:
      - "automoto/developer_dotnet.py"
      - "automoto/server.py"
      - "automoto/web/static/developer-dotnet.js"
      - "automoto/web/static/developer-studio.js"
      - "tests/test_developer_dotnet.py"
      - "tests/fixtures/v22-*/**"
      - ".github/workflows/developer-dotnet-v22.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-integration:
    name: .NET ${{ matrix.sdk }} / Python 3.13 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, sdk: '8.0.x'}
          - {os: ubuntu-latest, sdk: '10.0.x'}
          - {os: macos-latest, sdk: '10.0.x'}
          - {os: windows-latest, sdk: '10.0.x'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-dotnet@v4
        if: matrix.sdk == '10.0.x'
        with:
          dotnet-version: "10.0.x"
      - name: Report real installed .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks
      - name: Prewarm fixed xUnit/NUnit packages on isolated CI runner
        run: |
          dotnet restore tests/fixtures/v22-xunit/V22.Xunit.csproj -p:NuGetAudit=false
          dotnet restore tests/fixtures/v22-nunit/V22.Nunit.csproj -p:NuGetAudit=false
      - name: Install AutoMoto and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Real .NET SDK/MSBuild/xUnit/NUnit tests and security regression
        env:
          AUTOMOTO_RATE_LIMIT: "10000"
          AUTOMOTO_V22_TEST_PACKAGES_READY: "1"
        run: python -m pytest -q tests/test_developer_dotnet.py
