name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core + dev, no GUI deps)
        run: |
          python -m pip install --upgrade pip
          pip install "openai>=1.60,<4" "anthropic>=0.40,<3" "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "pydantic>=2.7,<3" "python-dotenv>=1.0,<2" "rich>=13,<16" "pytest>=8,<10" "httpx>=0.27,<1"
      - name: Tests (mocked AI, no keys)
        run: python -m pytest -q
      - name: CLI smoke
        run: python -m automoto --version
