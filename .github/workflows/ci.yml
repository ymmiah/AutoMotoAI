name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core + dev, no GUI deps)
        run: |
          python -m pip install --upgrade pip
          pip install "openai>=1.60,<4" "anthropic>=0.40,<3" "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "pydantic>=2.7,<3" "python-dotenv>=1.0,<2" "rich>=13,<16" "python-docx>=1.1,<2" "openpyxl>=3.1,<4" "python-pptx>=1.0,<2" "pypdf>=5,<7" "defusedxml>=0.7,<1" "Pillow>=10" "pandas>=2" "PyYAML>=6,<7" "tomli>=2; python_version < '3.11'" "pytest>=8,<10" "httpx>=0.27,<1"
      - name: Tests (mocked AI, no keys)
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          python -m automoto --version
          python -m automoto tools
          python -m automoto skills
          python -m automoto routines list
          python -m automoto apps
          python -m automoto mcp

  office:
    # Office suite end to end with free LibreOffice + poppler: PDF export, TOC page numbers, recalc, renders;
    # plus archives / WordPress (php -l) / data files with the optional tools installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install LibreOffice (headless) and poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui poppler-utils fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest>=8,<10" "httpx>=0.27,<1"
      - name: Office tests (no skips allowed)
        run: |
          python -c "from automoto import office; assert office.lo_available(), 'LibreOffice not detected'"
          python -m pytest -q -rs tests/test_office.py
      - name: Archives, WordPress and data files (real php -l, 7-Zip, Parquet)
        run: |
          php -v | head -1
          command -v 7z || sudo apt-get install -y -q p7zip-full
          pip install "pyarrow>=15" "py7zr>=0.21"
          python -c "import shutil; assert shutil.which('php'), 'php not found'"
          python -m pytest -q -rs tests/test_archives.py tests/test_wordpress.py tests/test_datafiles.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install "pip-audit>=2.7" "bandit>=1.8"
      - name: pip-audit (known CVEs in Python dependencies)
        run: pip-audit -r requirements.txt
      - name: bandit (medium+ severity)
        run: bandit -q -r automoto -ll
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (VS Code extension)
        working-directory: apps/vscode
        run: |
          npm ci --no-fund
          npm audit --audit-level=moderate

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/vscode
        run: npm ci --no-fund
      - name: Lint + compile + unit tests
        working-directory: apps/vscode
        run: |
          npm run lint
          npm run test:unit
      - name: Integration test in a real VS Code (xvfb)
        working-directory: apps/vscode
        run: xvfb-run -a npm run test:integration
      - name: Package .vsix
        working-directory: apps/vscode
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: automoto-ai-vsix
          path: apps/vscode/*.vsix

  docker:
    # hosted multi-user image: builds, runs as non-root, bootstraps the admin from env, serves the login page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t automoto:ci .
      - name: Run and smoke-test hosted mode
        run: |
          docker run -d --name am -p 8765:8765 -e AUTOMOTO_ADMIN_USER=owner -e AUTOMOTO_ADMIN_PASSWORD=ci-only-pass-123 -e AUTOMOTO_COOKIE_SECURE=0 automoto:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8765/api/auth/info | grep -q '"signup":"invite"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/settings)" = "401"
          test "$(docker exec am id -u)" = "10001"
          docker logs am | grep -q "Created the first admin 'owner'"
          docker exec am python -m automoto admin list | grep -q owner
          docker exec am sh -c 'command -v pdftotext && command -v php && command -v 7z'
      - name: Single-user mode in Docker (host network) and Docker Compose
        run: |
          docker run -d --name solo --network host -e AUTOMOTO_MODE=local -e AUTOMOTO_HOST=127.0.0.1 -e PORT=8766 automoto:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8766/api/health && break; sleep 1; done
          link=$(docker exec solo python -m automoto open --print)
          test "$(curl -s -o /dev/null -c jar -w '%{http_code}' "$link")" = "303"
          test "$(curl -s -o /dev/null -b jar -w '%{http_code}' http://127.0.0.1:8766/api/agent/info)" = "200"
          docker rm -f solo am
          printf 'AUTOMOTO_ADMIN_USER=owner\nAUTOMOTO_ADMIN_PASSWORD=ci-only-pass-123\n' > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8765/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://127.0.0.1:8765' -H 'Content-Type: application/json' -d '{"username":"owner","password":"ci-only-pass-123"}' http://127.0.0.1:8765/api/auth/login)" = "200"
          docker compose down
          docker compose up -d
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8765/api/health && break; sleep 1; done
          docker compose exec -T automoto python -m automoto admin list | grep -q owner
          docker compose down -v

  install:
    # the documented installers on real Windows, macOS and Linux runners: release wheel (pinned SHA-256)
    # and the current source, then start the server and sign in with the one-time link
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the installers
        shell: pwsh
        run: |
          $e = $null; $t = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$t, [ref]$e)
          if ($e.Count) { $e | ForEach-Object { $_.Message }; exit 1 }
          if ($IsLinux) {
            shellcheck -S warning scripts/install.sh
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
            $r = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error
            if ($r) { $r | Format-Table -AutoSize | Out-String -Width 200; exit 1 }
          }
      - name: install.sh - release wheel, then this source
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh --yes
          ~/.local/bin/automoto --version | grep -x "5.5.0"
          bash scripts/install.sh --from-source --yes
          ~/.local/bin/automoto status | tee status.txt || true
          grep -q "^Settings read from: .*/\.automoto/\.env$" status.txt
          test "$(stat -c %a ~/.automoto/.env 2>/dev/null || stat -f %Lp ~/.automoto/.env)" = "600"
      - name: install.sh - run the server and sign in
        if: runner.os != 'Windows'
        run: |
          ~/.local/bin/automoto serve --no-browser --port 8799 > serve.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8799/api/health && break; sleep 1; done
          link=$(~/.local/bin/automoto open --print)
          test "$(curl -s -o /dev/null -c jar -w '%{http_code}' "$link")" = "303"
          test "$(curl -s -o /dev/null -b jar -w '%{http_code}' http://127.0.0.1:8799/api/status)" = "200"
          ~/.local/bin/automoto serve --no-browser --port 8799 2>&1 | grep -q "already in use"
          kill %1
          bash scripts/install.sh --uninstall
          test ! -e ~/.local/bin/automoto && test -f ~/.automoto/.env
      - name: install.ps1 - release wheel (Windows PowerShell 5.1), then this source (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Yes
          if ($LASTEXITCODE) { exit 1 }
          $am = Join-Path $env:LOCALAPPDATA "automoto-ai\bin\automoto.cmd"
          $v = & $am --version; if ($v -ne "5.5.0") { throw "version $v" }
          ./scripts/install.ps1 -FromSource -Yes
          $s = (& $am status) -join "`n"; $s
          if ($s -notmatch "Settings read from: .*\.automoto\\\.env") { throw "the .env in the data folder was not read" }
          if (-not ([Environment]::GetEnvironmentVariable("Path", "User") -split ";" -contains (Split-Path $am))) { throw "not on PATH" }
      - name: install.ps1 - run the server and sign in
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $am = Join-Path $env:LOCALAPPDATA "automoto-ai\bin\automoto.cmd"
          $p = Start-Process -FilePath $am -ArgumentList "serve","--no-browser","--port","8799" -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..40) { try { Invoke-RestMethod http://127.0.0.1:8799/api/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "server did not start" }
          $link = (& $am open --print | Select-Object -Last 1).Trim()
          $r = Invoke-WebRequest $link -MaximumRedirection 0 -SkipHttpErrorCheck -SessionVariable web
          if ($r.StatusCode -ne 303) { throw "launch link gave $($r.StatusCode)" }
          $st = Invoke-WebRequest http://127.0.0.1:8799/api/status -WebSession $web
          if ($st.StatusCode -ne 200) { throw "status $($st.StatusCode)" }
          $ErrorActionPreference = "Continue"
          $busy = (& $am serve --no-browser --port 8799 2>&1 | ForEach-Object { "$_" }) -join "`n"
          $ErrorActionPreference = "Stop"
          if ($busy -notmatch "already in use") { throw "no port-in-use message: $busy" }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "automoto" -and $_.CommandLine -match "8799" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          ./scripts/install.ps1 -Uninstall
          if (Test-Path $am) { throw "still installed" }
