name: Developer Studio V21 Java JVM acceptance

on:
  push:
    branches: [main]
    paths:
      - "automoto/developer_jvm.py"
      - "automoto/server.py"
      - "automoto/web/static/developer-jvm.js"
      - "automoto/web/static/developer-studio.js"
      - "tests/test_developer_jvm.py"
      - "tests/fixtures/v21-junit/**"
      - "tests/fixtures/v21-gradle/**"
      - ".github/workflows/developer-jvm-v21.yml"
      - "scripts/ci/apt-install.sh"
      - "scripts/ci/pr_self_changed.py"
      - ".github/workflows/ci-path-filter.yml"
  pull_request:
    paths:
      - "automoto/developer_jvm.py"
      - "automoto/server.py"
      - "automoto/web/static/developer-jvm.js"
      - "automoto/web/static/developer-studio.js"
      - "tests/test_developer_jvm.py"
      - "tests/fixtures/v21-junit/**"
      - "tests/fixtures/v21-gradle/**"
      - ".github/workflows/developer-jvm-v21.yml"
      - "scripts/ci/apt-install.sh"
      - "scripts/ci/pr_self_changed.py"
      - ".github/workflows/ci-path-filter.yml"
  schedule:
    # Weekly macOS / real-toolchain coverage, staggered so versions
    # do not all queue macOS runners at the same minute.
    - cron: "50 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    uses: ./.github/workflows/ci-path-filter.yml
    with:
      patterns: |
        automoto/developer_jvm.py
        automoto/web/static/developer-jvm.js
        tests/test_developer_jvm.py
        tests/fixtures/v21-junit/**
        tests/fixtures/v21-gradle/**
        .github/workflows/developer-jvm-v21.yml

  jvm-integration:
    name: JDK ${{ matrix.java }} / Python 3.13 (${{ matrix.os }})
    needs: paths
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.paths.outputs.self == 'true' && '[{"os":"ubuntu-latest","java":"21"},{"os":"ubuntu-latest","java":"25"},{"os":"macos-latest","java":"21"},{"os":"windows-latest","java":"21"}]' || '[{"os":"ubuntu-latest","java":"21"},{"os":"ubuntu-latest","java":"25"},{"os":"windows-latest","java":"21"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "${{ matrix.java }}"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.2.1"
      - name: Report installed Java and Gradle
        run: |
          java -version
          javac -version
          gradle --version
      - name: Prewarm real JUnit and Maven plugins on Linux CI only
        if: runner.os == 'Linux'
        run: mvn -B -ntp -f tests/fixtures/v21-junit/pom.xml test
      - name: Install AutoMoto and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run exact JDK, JUnit, Gradle and security regression
        env:
          AUTOMOTO_RATE_LIMIT: "10000"
          AUTOMOTO_V21_JUNIT_READY: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: python -m pytest -q tests/test_developer_jvm.py
