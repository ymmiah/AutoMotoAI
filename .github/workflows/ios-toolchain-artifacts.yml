# Manual check of the iPhone support-file lock. It does not download those
# files and it does not create a GitHub Release. Publishing is an owner step.
name: iOS toolchain support files
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Scan hosts and the checksum lock
        run: python scripts/ios_toolchain_artifacts.py
