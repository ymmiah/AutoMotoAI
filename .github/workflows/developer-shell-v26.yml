name: Developer Studio V26 Shell Automation acceptance

on:
  pull_request:
    paths:
      - "automoto/developer_shell.py"
      - "automoto/server.py"
      - "automoto/web/static/developer-shell.js"
      - "automoto/web/static/developer-studio.js"
      - "apps/desktop/test/ui-smoke.cjs"
      - "tests/test_developer_shell.py"
      - "tests/fixtures/v26-shell/**"
      - ".github/workflows/developer-shell-v26.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-ubuntu:
    name: Bash Zsh Fish ShellCheck and guarded execution (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Linux shell interpreters and static analyser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh fish shellcheck
          bash --version | head -1
          zsh --version
          fish --version
          shellcheck --version
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Real Bash Zsh Fish syntax/literal fixture and ShellCheck, security and auth
        env:
          AUTOMOTO_V26_REAL_SHELL: "1"
          AUTOMOTO_V26_ALL_POSIX: "1"
          AUTOMOTO_RATE_LIMIT: "10000"
        run: python -m pytest -q -rs tests/test_developer_shell.py

  shell-macos:
    name: macOS built-in Bash/Zsh guarded execution and shell security
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Report installed shells
        run: |
          bash --version | head -1
          zsh --version
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Real Bash fixture/syntax and all static security tests
        env:
          AUTOMOTO_V26_REAL_SHELL: "1"
          AUTOMOTO_RATE_LIMIT: "10000"
        run: python -m pytest -q -rs tests/test_developer_shell.py

  shell-windows:
    name: Windows PowerShell/Batch parser, guarded fixture and security
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Report installed PowerShell and CMD
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          & "$env:SystemRoot\System32\cmd.exe" /D /C ver
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Real PowerShell AST parse, literal fixture and Windows CMD with security gates
        env:
          AUTOMOTO_V26_REAL_SHELL: "1"
          AUTOMOTO_RATE_LIMIT: "10000"
        run: python -m pytest -q -rs tests/test_developer_shell.py
