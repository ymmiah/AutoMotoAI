name: Developer Studio V23 Kotlin Android acceptance

on:
  push:
    branches: [main]
    paths:
      - "automoto/developer_android.py"
      - "automoto/server.py"
      - "automoto/web/static/developer-android.js"
      - "automoto/web/static/developer-studio.js"
      - "tests/test_developer_android.py"
      - "tests/fixtures/v23-*/**"
      - "tests/scripts/v23_android_emulator.sh"
      - ".github/workflows/developer-android-v23.yml"
      - "scripts/ci/apt-install.sh"
      - "scripts/ci/pr_self_changed.py"
      - ".github/workflows/ci-path-filter.yml"
  pull_request:
    paths:
      - "automoto/developer_android.py"
      - "automoto/server.py"
      - "automoto/web/static/developer-android.js"
      - "automoto/web/static/developer-studio.js"
      - "tests/test_developer_android.py"
      - "tests/fixtures/v23-*/**"
      - "tests/scripts/v23_android_emulator.sh"
      - ".github/workflows/developer-android-v23.yml"
      - "scripts/ci/apt-install.sh"
      - "scripts/ci/pr_self_changed.py"
      - ".github/workflows/ci-path-filter.yml"
  schedule:
    # Weekly macOS / real-toolchain coverage, staggered so versions
    # do not all queue macOS runners at the same minute.
    - cron: "20 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    uses: ./.github/workflows/ci-path-filter.yml
    with:
      patterns: |
        automoto/developer_android.py
        automoto/web/static/developer-android.js
        tests/test_developer_android.py
        tests/fixtures/v23-*/**
        tests/scripts/v23_android_emulator.sh
        .github/workflows/developer-android-v23.yml

  kotlin-jvm:
    name: Kotlin JVM Gradle 8.13 / ${{ matrix.os }}
    needs: paths
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.paths.outputs.self == 'true' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Real Kotlin/JVM compile and test (prewarm CI cache)
        run: gradle -p tests/fixtures/v23-kotlin --no-daemon --console=plain test
      - name: Install AutoMoto and pytest
        run: python -m pip install -e ".[dev]"
      - name: Run Kotlin/JVM real Gradle and security acceptance
        env:
          AUTOMOTO_RATE_LIMIT: "10000"
          AUTOMOTO_V23_REAL_KOTLIN: "${{ runner.os != 'Windows' && '1' || '0' }}"
        run: python -m pytest -q tests/test_developer_android.py

  android-emulator:
    name: Android SDK 35 / Gradle 8.13 / emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35 platform and tools in isolated CI
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build real sample Android APK and run unit tests
        run: |
          gradle -p tests/fixtures/v23-android --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
      - name: Install AutoMoto and pytest
        run: python -m pip install -e ".[dev]"
      - name: Run offline Android Gradle API acceptance and security tests
        env:
          AUTOMOTO_RATE_LIMIT: "10000"
          AUTOMOTO_V23_REAL_ANDROID: "1"
        run: python -m pytest -q tests/test_developer_android.py
      - name: Enable hardware acceleration for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "/dev/kvm unavailable"; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash tests/scripts/v23_android_emulator.sh
