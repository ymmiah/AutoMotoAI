name: Developer Studio V20 native C/C++ acceptance

on:
  push:
    branches: [main]
    paths:
      - "automoto/developer_native.py"
      - "automoto/server.py"
      - "automoto/web/static/developer-native.js"
      - "automoto/web/static/developer-studio.js"
      - "tests/test_developer_native.py"
      - ".github/workflows/developer-native-v20.yml"
      - "scripts/ci/apt-install.sh"
      - "scripts/ci/pr_self_changed.py"
      - ".github/workflows/ci-path-filter.yml"
  pull_request:
    paths:
      - "automoto/developer_native.py"
      - "automoto/server.py"
      - "automoto/web/static/developer-native.js"
      - "automoto/web/static/developer-studio.js"
      - "tests/test_developer_native.py"
      - ".github/workflows/developer-native-v20.yml"
      - "scripts/ci/apt-install.sh"
      - "scripts/ci/pr_self_changed.py"
      - ".github/workflows/ci-path-filter.yml"
  schedule:
    # Weekly macOS / real-toolchain coverage, staggered so versions
    # do not all queue macOS runners at the same minute.
    - cron: "35 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    uses: ./.github/workflows/ci-path-filter.yml
    with:
      patterns: |
        automoto/developer_native.py
        automoto/web/static/developer-native.js
        tests/test_developer_native.py
        .github/workflows/developer-native-v20.yml

  native-integration:
    name: CMake C/C++ / Python 3.13 (${{ matrix.os }})
    needs: paths
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.paths.outputs.self == 'true' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Configure MSVC for Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Report installed native tools
        run: |
          cmake --version
          ctest --version
      - name: Install AutoMoto and pytest
        run: python -m pip install -e ".[dev]"
      - name: Run real compiler, CTest and sanitiser fixtures
        env:
          AUTOMOTO_RATE_LIMIT: "10000"
        run: python -m pytest -q tests/test_developer_native.py
