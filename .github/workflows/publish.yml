name: Publish
# Runs when a version tag (v5.5.0, ...) is pushed. Every store is optional: a step only runs when its
# secret / variable exists, otherwise it prints a notice and skips. See docs/PUBLISHING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vsix:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build .vsix
        working-directory: apps/vscode
        run: |
          npm ci --no-fund
          npm run lint
          npm run test:unit
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: automoto-ai-vsix
          path: apps/vscode/*.vsix
      - name: VS Code Marketplace
        working-directory: apps/vscode
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice::VSCE_PAT secret not set - skipping the VS Code Marketplace"; exit 0; fi
          npx --no-install vsce publish --packagePath automoto-ai-*.vsix
      - name: Open VSX
        working-directory: apps/vscode
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice::OVSX_PAT secret not set - skipping Open VSX"; exit 0; fi
          npx --yes ovsx@0.10 publish automoto-ai-*.vsix -p "$OVSX_PAT"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  pypi:
    # optional: PyPI "trusted publishing" (no token stored). Turn on with the repository variable PYPI_PUBLISH=true
    # after adding this repo as a trusted publisher on pypi.org (environment "pypi").
    needs: python
    if: ${{ vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
