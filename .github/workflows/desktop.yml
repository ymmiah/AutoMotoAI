name: Windows app
# Builds the Windows installers (.exe NSIS + .msi) on every change to the app or the engine, smoke-tests them
# on a clean runner (silent install, launch, local engine health, close, uninstall), and on a version tag
# attaches them plus the signed updater manifest (latest.json) to that tag's GitHub Release.
# Also builds the Microsoft Store package (.msixupload, unsigned: the Store signs it) and test-installs it.
# Optional: a manual run with "store_upload" ticked sends it to Partner Center as a DRAFT submission (needs the
# AZURE_AD_* / SELLER_ID secrets and the MSSTORE_PRODUCT_ID variable; skipped with a notice otherwise).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["apps/desktop/**", "automoto/**", "packaging/msstore/**", "packaging/branding/**", "scripts/install.ps1", "scripts/ci/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "automoto/**", "packaging/msstore/**", "packaging/branding/**", "scripts/install.ps1", "scripts/ci/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      store_upload:
        description: "Upload the MSIX to Partner Center as a draft submission (needs the Store secrets)"
        type: boolean
        default: false
      store_flight_id:
        description: "Optional: package flight ID (for a beta flight) instead of the main submission"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write   # only used on tags, to attach the installers to the release
    env:
      AUTOMOTO_DEFAULT_SERVER: ${{ vars.AUTOMOTO_DEFAULT_SERVER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versions agree (pyproject, app, Cargo, package.json)
        shell: pwsh
        run: |
          $py = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $pkg = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          "pyproject $py · tauri.conf $conf · Cargo $cargo · package.json $pkg"
          if (($conf, $cargo, $pkg | Sort-Object -Unique).Count -ne 1) { throw "app versions differ" }
          # the engine uses PEP 440 for the same version: 5.6.0-beta.1 <-> 5.6.0b1
          if (($conf -replace '-beta\.', 'b') -ne $py) { throw "app $conf doesn't match the engine $py" }
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$conf") { throw "tag $env:GITHUB_REF_NAME is not v$conf" }
      - name: Rust unit tests and lint
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the installers
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          node --check dist/app.js
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            "::notice::No updater signing key (fork PR) - building without update signatures"
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding ascii no-updater.json
            npx tauri build --bundles nsis,msi --config no-updater.json
          } else {
            npx tauri build --bundles nsis,msi
          }
          if ($LASTEXITCODE) { exit 1 }
      - name: Collect the installers
        shell: pwsh
        run: ./scripts/ci/collect-windows.ps1 -Out out
      - name: Branding check (version info and icons of the app and the installers)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Drawing
          $app = Get-Item "apps/desktop/src-tauri/target/release/AutoMoto AI.exe"
          foreach ($f in @($app) + @(Get-ChildItem out/*.exe)) {
            $v = $f.VersionInfo
            "{0}: ProductName='{1}' FileDescription='{2}' CompanyName='{3}' LegalCopyright='{4}' ProductVersion='{5}' FileVersion='{6}'" -f `
              $f.Name, $v.ProductName, $v.FileDescription, $v.CompanyName, $v.LegalCopyright, $v.ProductVersion, $v.FileVersion
            if ($v.ProductName -ne "AutoMoto AI") { "::warning::$($f.Name) ProductName is '$($v.ProductName)'" }
            if ($v.CompanyName -ne "Yasin Mohammed Miah") { "::warning::$($f.Name) CompanyName is '$($v.CompanyName)'" }
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($f.FullName)
            $icon.ToBitmap().Save("shots/icon-$($f.BaseName).png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: automoto-ai-windows
          path: out/*
          if-no-files-found: error
      - name: Microsoft Store package (MSIX) - build, validate, test-install
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
          MSSTORE_DISPLAY_NAME: ${{ vars.MSSTORE_DISPLAY_NAME }}
        run: ./scripts/ci/pack-msix.ps1 -Out msstore -TestInstall
      - uses: actions/upload-artifact@v4
        with:
          name: automoto-ai-msstore
          path: msstore/*
          if-no-files-found: error
      - name: Install the local engine (from this source) for the smoke test
        shell: pwsh
        run: |
          ./scripts/install.ps1 -FromSource -Yes
          exit 0
      - name: Smoke test - NSIS (.exe) silent install, launch, local engine, close, uninstall
        shell: pwsh
        run: ./scripts/ci/smoke-windows.ps1 -Kind nsis -Dir out -Shots shots
      - name: Smoke test - MSI silent install, launch, local engine, close, uninstall
        shell: pwsh
        run: ./scripts/ci/smoke-windows.ps1 -Kind msi -Dir out -Shots shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots-and-logs
          path: shots/*
          if-no-files-found: ignore
      - name: Release notes generator works (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: python scripts/ci/release_notes.py names (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
      - name: Attach to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/release-windows.ps1 -Dir out -Tag $env:GITHUB_REF_NAME -Repo $env:GITHUB_REPOSITORY

  store-upload:
    # manual only: upload the MSIX to Partner Center and leave the submission as a DRAFT (you review and submit it
    # there). Works once the app's first submission was published by hand (Microsoft's rule for the API).
    needs: windows
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.store_upload }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      FLIGHT_ID: ${{ inputs.store_flight_id }}
    steps:
      - name: Are the Store secrets set?
        id: gate
        shell: pwsh
        run: |
          $missing = @("AZURE_AD_TENANT_ID", "AZURE_AD_APPLICATION_CLIENT_ID", "AZURE_AD_APPLICATION_SECRET", "SELLER_ID", "MSSTORE_PRODUCT_ID") |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { "::notice::Microsoft Store upload skipped - not set: $($missing -join ', ')"; "go=false" >> $env:GITHUB_OUTPUT }
          else { "go=true" >> $env:GITHUB_OUTPUT }
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.go == 'true'
        with:
          name: automoto-ai-msstore
          path: msstore
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: steps.gate.outputs.go == 'true'
      - name: Upload to Partner Center (draft, not submitted)
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE) { throw "msstore reconfigure failed" }
          $pkg = (Get-ChildItem msstore/*.msixupload | Select-Object -First 1).FullName
          $flight = @(); if ($env:FLIGHT_ID) { $flight = @("--flightId", $env:FLIGHT_ID) }
          msstore publish $pkg --appId $env:MSSTORE_PRODUCT_ID --noCommit @flight
          if ($LASTEXITCODE) { throw "msstore publish failed" }
          "Uploaded as a draft. Open Partner Center to check it and press Submit." >> $env:GITHUB_STEP_SUMMARY
