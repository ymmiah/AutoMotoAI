name: Windows app
# Builds the Windows installers (.exe NSIS + .msi) on every change to the app or the engine, smoke-tests them
# on a clean runner (silent install, launch, local engine health, close, uninstall), and on a version tag
# attaches them plus the signed updater manifest (latest.json) to that tag's GitHub Release.
# Also builds the Microsoft Store package (.msixupload, unsigned: the Store signs it) and test-installs it.
# Optional Azure Artifact Signing (formerly Trusted Signing) Authenticode-signs AutoMoto AI.exe, then the
# .exe/.msi, then the Tauri updater .sig files and SHA256SUMS are written for those final files. Skipped
# with a notice when the AZURE_* secrets / TRUSTED_SIGNING_* variables are absent (see
# docs/signing/TRUSTED_SIGNING_SETUP.md). The Store MSIX is never signed here.
# Optional: a manual run with "store_upload" ticked sends it to Partner Center as a DRAFT submission (needs the
# AZURE_AD_* / SELLER_ID secrets and the MSSTORE_PRODUCT_ID variable; skipped with a notice otherwise).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["apps/desktop/**", "automoto/**", "pyproject.toml", "packaging/msstore/**", "packaging/branding/**", "scripts/install.ps1", "scripts/ci/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "automoto/**", "pyproject.toml", "packaging/msstore/**", "packaging/branding/**", "scripts/install.ps1", "scripts/ci/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      store_upload:
        description: "Upload the MSIX to Partner Center as a draft submission (needs the Store secrets)"
        type: boolean
        default: false
      store_flight_id:
        description: "Optional: package flight ID (for a beta flight) instead of the main submission"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write   # only used on tags, to attach the installers to the release
      id-token: write   # Azure Artifact Signing via OIDC (unused when those secrets are absent)
    env:
      AUTOMOTO_DEFAULT_SERVER: ${{ vars.AUTOMOTO_DEFAULT_SERVER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Versions agree (pyproject, app, Cargo, package.json)
        shell: pwsh
        run: |
          $py = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $pkg = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          "pyproject $py · tauri.conf $conf · Cargo $cargo · package.json $pkg"
          if (($conf, $cargo, $pkg | Sort-Object -Unique).Count -ne 1) { throw "app versions differ" }
          # the engine uses PEP 440 for the same version: 5.6.0-beta.1 <-> 5.6.0b1
          $engine = (Select-String -Path automoto/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($engine -ne $py) { throw "Runtime engine version $engine differs from wheel $py" }
          if (($conf -replace '-beta\.', 'b') -ne $py) { throw "app $conf doesn't match the engine $py" }
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$conf") { throw "tag $env:GITHUB_REF_NAME is not v$conf" }
      - name: Build matching Python engine wheel
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir engine-wheel .
          if ($LASTEXITCODE) { throw "Could not build the bundled engine" }
          $py = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $wheel = "engine-wheel/automoto_ai-$py-py3-none-any.whl"
          if (-not (Test-Path $wheel)) { throw "Missing matching engine wheel" }
          (Get-FileHash $wheel -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -Encoding ascii "$wheel.sha256"
      - name: Rust unit tests and lint
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Install the app's npm packages (no signing key in this step)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          node --check dist/app.js
      - name: Azure Artifact Signing credentials present?
        id: signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
        run: |
          $need = @("AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_SUBSCRIPTION_ID", "TRUSTED_SIGNING_ENDPOINT", "TRUSTED_SIGNING_ACCOUNT", "TRUSTED_SIGNING_PROFILE")
          $missing = $need | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          $allowed = ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") -or ($env:GITHUB_REF -eq "refs/heads/main") -or ($env:GITHUB_REF -like "refs/tags/v*")
          if (-not $allowed) {
            "::notice::Azure Artifact Signing skipped on $($env:GITHUB_EVENT_NAME) ($($env:GITHUB_REF)). Signing runs on main, version tags, and manual workflow_dispatch."
            "go=false" >> $env:GITHUB_OUTPUT
            "auth=" >> $env:GITHUB_OUTPUT
          } elseif ($missing) {
            "::notice::Azure Artifact Signing skipped - not set: $($missing -join ', '). Direct .exe/.msi stay unsigned until these are added (see docs/signing/TRUSTED_SIGNING_SETUP.md)."
            "go=false" >> $env:GITHUB_OUTPUT
            "auth=" >> $env:GITHUB_OUTPUT
          } elseif ($env:AZURE_CLIENT_SECRET) {
            "go=true" >> $env:GITHUB_OUTPUT
            "auth=secret" >> $env:GITHUB_OUTPUT
          } else {
            "go=true" >> $env:GITHUB_OUTPUT
            "auth=oidc" >> $env:GITHUB_OUTPUT
          }
      - name: Build the app executable
        working-directory: apps/desktop
        shell: pwsh
        run: |
          # Include the matching engine in the standalone installers as well as the Store MSIX.
          # Updater .sig files are written later, after Authenticode signing, so they match the final files.
          $config = @{ bundle = @{ resources = @{
            "../../../scripts/install.ps1" = "resources/install.ps1"
            "../../../engine-wheel/" = "resources/"
          }; createUpdaterArtifacts = $false } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 engine-bundle.json
          npx tauri build --no-bundle --config engine-bundle.json
          if ($LASTEXITCODE) { throw "tauri build --no-bundle failed" }
      - name: Sign in to Azure (OIDC)
        if: steps.signing.outputs.go == 'true' && steps.signing.outputs.auth == 'oidc'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure (client secret)
        if: steps.signing.outputs.go == 'true' && steps.signing.outputs.auth == 'secret'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      - name: Sign the app executable
        if: steps.signing.outputs.go == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files: "${{ github.workspace }}/apps/desktop/src-tauri/target/release/AutoMoto AI.exe"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description-url: https://ymmiah.github.io/AutoMotoAI/
      - name: Bundle the installers
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npx tauri bundle --bundles nsis,msi --config engine-bundle.json
          if ($LASTEXITCODE) { throw "tauri bundle failed" }
      - name: Sign the Windows installers
        if: steps.signing.outputs.go == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/apps/desktop/src-tauri/target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description-url: https://ymmiah.github.io/AutoMotoAI/
      - name: Collect the installers
        shell: pwsh
        run: ./scripts/ci/collect-windows.ps1 -Out out
      - name: Sign updater payloads for the final files
        shell: pwsh
        # The updater signing key signs every auto-update: only this step gets it, so a compromised
        # action or npm install script in another step can't read it. Must run after Authenticode
        # signing so the .sig files and SHA256SUMS match the files that are uploaded.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/ci/updater-sign.ps1 -Dir out
      - name: Branding check (version info and icons of the app and the installers)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Drawing
          $app = Get-Item "apps/desktop/src-tauri/target/release/AutoMoto AI.exe"
          foreach ($f in @($app) + @(Get-ChildItem out/*.exe)) {
            $v = $f.VersionInfo
            "{0}: ProductName='{1}' FileDescription='{2}' CompanyName='{3}' LegalCopyright='{4}' ProductVersion='{5}' FileVersion='{6}'" -f `
              $f.Name, $v.ProductName, $v.FileDescription, $v.CompanyName, $v.LegalCopyright, $v.ProductVersion, $v.FileVersion
            if ($v.ProductName -ne "AutoMoto AI") { "::warning::$($f.Name) ProductName is '$($v.ProductName)'" }
            if ($v.CompanyName -ne "Yasin Mohammed Miah") { "::warning::$($f.Name) CompanyName is '$($v.CompanyName)'" }
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($f.FullName)
            $icon.ToBitmap().Save("shots/icon-$($f.BaseName).png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automoto-ai-windows
          path: out/*
          if-no-files-found: error
      - name: Microsoft Store package (MSIX) - build, validate, test-install
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
          MSSTORE_DISPLAY_NAME: ${{ vars.MSSTORE_DISPLAY_NAME }}
        run: ./scripts/ci/pack-msix.ps1 -Out msstore -TestInstall
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automoto-ai-msstore
          path: msstore/*
          if-no-files-found: error
      - name: Install the local engine (from this source) for the smoke test
        shell: pwsh
        run: |
          ./scripts/install.ps1 -FromSource -Yes
          exit 0
      - name: Smoke test - NSIS (.exe) silent install, launch, local engine, close, uninstall
        shell: pwsh
        run: ./scripts/ci/smoke-windows.ps1 -Kind nsis -Dir out -Shots shots
      - name: Smoke test - MSI silent install, launch, local engine, close, uninstall
        shell: pwsh
        run: ./scripts/ci/smoke-windows.ps1 -Kind msi -Dir out -Shots shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-test-screenshots-and-logs
          path: shots/*
          if-no-files-found: ignore
      - name: Release notes generator works (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: python scripts/ci/release_notes.py names (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
      - name: Attach to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/release-windows.ps1 -Dir out -Tag $env:GITHUB_REF_NAME -Repo $env:GITHUB_REPOSITORY

  store-upload:
    # manual only: upload the MSIX to Partner Center and leave the submission as a DRAFT (you review and submit it
    # there). Works once the app's first submission was published by hand (Microsoft's rule for the API).
    needs: windows
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.store_upload }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      FLIGHT_ID: ${{ inputs.store_flight_id }}
    steps:
      - name: Are the Store secrets set?
        id: gate
        shell: pwsh
        run: |
          $missing = @("AZURE_AD_TENANT_ID", "AZURE_AD_APPLICATION_CLIENT_ID", "AZURE_AD_APPLICATION_SECRET", "SELLER_ID", "MSSTORE_PRODUCT_ID") |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { "::notice::Microsoft Store upload skipped - not set: $($missing -join ', ')"; "go=false" >> $env:GITHUB_OUTPUT }
          else { "go=true" >> $env:GITHUB_OUTPUT }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.gate.outputs.go == 'true'
        with:
          name: automoto-ai-msstore
          path: msstore
      - uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
        if: steps.gate.outputs.go == 'true'
      - name: Upload to Partner Center (draft, not submitted)
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE) { throw "msstore reconfigure failed" }
          $pkg = (Get-ChildItem msstore/*.msixupload | Select-Object -First 1).FullName
          $flight = @(); if ($env:FLIGHT_ID) { $flight = @("--flightId", $env:FLIGHT_ID) }
          msstore publish $pkg --appId $env:MSSTORE_PRODUCT_ID --noCommit @flight
          if ($LASTEXITCODE) { throw "msstore publish failed" }
          "Uploaded as a draft. Open Partner Center to check it and press Submit." >> $env:GITHUB_STEP_SUMMARY
