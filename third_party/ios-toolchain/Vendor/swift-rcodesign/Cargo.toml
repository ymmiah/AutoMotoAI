[package]
name = "swift-rcodesign"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "rcodesign_ffi"
# including rlib makes the archives much larger
crate-type = ["staticlib"]

[dependencies]
apple-codesign = { version = "=0.29.0", default-features = false }
plist = "1.8"
pem = "3"
x509-certificate = "0.24"
zeroize = "1"
# Force native compression dependencies into the archive even when pkg-config
# discovers shared system libraries on the machine producing the artifact.
bzip2-sys = { version = "0.1", features = ["static"] }
lzma-sys = { version = "0.1", features = ["static"] }

[profile.release]
lto = "fat"
codegen-units = 1
