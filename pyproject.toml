[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automoto-ai"
version = "4.0.0"
description = "AutoMoto AI v4 'Cousin' - multi-AI assistant with auto-failover, vision routing and confirmed desktop actions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yasin Mohammed Miah (ymmiah)" }]
dependencies = [
  "openai>=1.60,<4",
  "anthropic>=0.40,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13,<16",
]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
automoto = "automoto.cli:main"

[tool.setuptools]
packages = ["automoto"]

[tool.setuptools.package-data]
automoto = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
