[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automoto-ai"
version = "5.1.0"
description = "AutoMoto AI v5 'Agent' - your AI cousin: an autonomous agent with tools, approvals, memory, skills and routines over a multi-AI router with auto-failover"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yasin Mohammed Miah (ymmiah)" }]
dependencies = [
  "openai>=1.60,<4",
  "anthropic>=0.40,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13,<16",
]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
automoto = "automoto.cli:main"

[tool.setuptools]
packages = ["automoto"]

[tool.setuptools.package-data]
automoto = ["web/*.html", "web/static/*.js", "web/static/*.css", "web/static/vendor/*", "skills_bundled/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
