[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automoto-ai"
version = "5.3.0"
description = "AutoMoto AI v5 'Agent' - a local AI agent with skills, an Office suite (Word, Excel, PowerPoint, PDF), local apps, service connectors, a VS Code extension, approvals, memory and routines over a multi-AI router with auto-failover"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yasin Mohammed Miah (ymmiah)" }]
dependencies = [
  "openai>=1.60,<4",
  "anthropic>=0.40,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13,<16",
  # Office suite (Word / Excel / PowerPoint / PDF) - pure Python, free
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "pypdf>=5,<7",
  "defusedxml>=0.7,<1",
  "Pillow>=10",
  # Data files (v5.4)
  "PyYAML>=6,<7",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54"]
office = ["pandas>=2"]  # numeric summaries in office_read
data = ["pyarrow>=15", "py7zr>=0.21", "tomli-w>=1"]  # Parquet, .7z without the 7-Zip CLI, TOML writing
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
automoto = "automoto.cli:main"

[tool.setuptools]
packages = ["automoto"]

[tool.setuptools.package-data]
automoto = ["web/*.html", "web/static/*.js", "web/static/*.css", "web/static/vendor/*", "skills_bundled/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
