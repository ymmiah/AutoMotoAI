<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="automoto-version" content="__AUTOMOTO_VERSION__" />
<meta name="color-scheme" content="dark light" />
<title>__BRAND__</title>
<meta name="automoto-brand" content="__BRAND__" />
<meta name="automoto-brand-short" content="__BRAND_SHORT__" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2338f2a5'/%3E%3Cpath d='M9 22l7-13 7 13M12 17h8' stroke='%230b0f14' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/app.css?v=__AUTOMOTO_VERSION__" />
<link rel="stylesheet" href="/static/visual-studio.css?v=__AUTOMOTO_VERSION__" />
<link rel="stylesheet" href="/static/document-assistant.css?v=__AUTOMOTO_VERSION__" />
<link rel="stylesheet" href="/static/spreadsheet-studio.css?v=__AUTOMOTO_VERSION__" />
<link rel="stylesheet" href="/static/commercial-studio.css?v=__AUTOMOTO_VERSION__" />
<link rel="stylesheet" href="/static/financial-studio.css?v=__AUTOMOTO_VERSION__" />
<link rel="stylesheet" href="/static/business-workflows.css?v=__AUTOMOTO_VERSION__" />
<link rel="stylesheet" id="hljsTheme" href="/static/vendor/hljs-dark.css" />
<script src="/static/theme-boot.js?v=__AUTOMOTO_VERSION__"></script>
</head>
<body>
<a class="skip" href="#composerInput">Skip to message box</a>
<header class="am-chrome" id="amChrome">
  <button type="button" class="am-menu" data-chrome="menu" aria-haspopup="menu" aria-expanded="false" aria-controls="amAppMenu">Menu</button>
  <div class="am-drag" data-tauri-drag-region>
    <span class="am-mark" aria-hidden="true">A</span>
    <span class="am-caption" id="amChromeTitle" data-tauri-drag-region>AutoMoto AI</span>
  </div>
  <div class="am-controls" role="toolbar" aria-label="Window">
    <button type="button" data-chrome="min" aria-label="Minimize"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg></button>
    <button type="button" data-chrome="max" aria-label="Maximize"><svg class="ico-max" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg><svg class="ico-restore" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.8" y="3.2" width="7.2" height="7.2" rx="1.2"/><path d="M6.2 6.1H4.2A1.2 1.2 0 0 0 3 7.3v4.5A1.2 1.2 0 0 0 4.2 13h4.5a1.2 1.2 0 0 0 1.2-1.2V10"/></svg></button>
    <button type="button" data-chrome="close" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5"/></svg></button>
  </div>
  <div class="am-appmenu" id="amAppMenu" role="menu" hidden>
    <button type="button" role="menuitem" data-chrome="act" data-action="home">Switch Local / Cloud / Server <span class="k">Ctrl+Shift+H</span></button>
    <button type="button" role="menuitem" data-chrome="act" data-action="reload">Reload <span class="k">Ctrl+R</span></button>
    <button type="button" role="menuitem" data-chrome="act" data-action="updates">Check for updates</button>
    <button type="button" role="menuitem" data-chrome="act" data-action="signout">Sign out of this device</button>
    <div role="separator"></div>
    <button type="button" role="menuitem" data-chrome="act" data-action="guide">Step-by-step guide <span class="k">F1</span></button>
    <button type="button" role="menuitem" data-chrome="act" data-action="log">Open the local engine log</button>
    <button type="button" role="menuitem" data-chrome="act" data-action="about">About AutoMoto AI</button>
    <div role="separator"></div>
    <button type="button" role="menuitem" data-chrome="act" data-action="quit">Quit <span class="k">Ctrl+Q</span></button>
  </div>
</header>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="side-head">
      <a class="brand" href="#/new" aria-label="__BRAND__ home"><span class="logo" aria-hidden="true">A</span><span>__BRAND__</span></a>
      <button class="icon-btn only-mobile" id="closeSide" aria-label="Close sidebar" data-icon="x"></button>
    </div>
    <button class="new-chat" id="newChat" title="New chat (Ctrl+N or Ctrl+Shift+O)"><span data-icon="plus"></span>New chat<kbd>⌘N</kbd></button>
    <label class="search">
      <span data-icon="search"></span>
      <input id="convSearch" type="search" placeholder="Search chats" aria-label="Search conversations" autocomplete="off" />
      <kbd>⌘K</kbd>
    </label>
    <button class="command-launch" id="commandLaunch"><span data-icon="sparkle"></span>Quick commands<kbd>⌘K</kbd></button>
    <nav class="nav" aria-label="Pages">
      <a href="#/tasks" data-page="tasks"><span data-icon="activity"></span>Tasks<span class="badge" id="taskBadge" hidden></span></a>
      <a href="#/memory" data-page="memory"><span data-icon="brain"></span>Memory</a>
      <a href="#/routines" data-page="routines"><span data-icon="clock"></span>Routines</a>
      <a href="#/files" data-page="files"><span data-icon="folder"></span>Files</a>
      <a href="#/documents" data-page="documents"><span data-icon="file"></span>Document Assistant</a>
      <a href="#/spreadsheets" data-page="spreadsheets"><span data-icon="sheet"></span>Invoices &amp; Spreadsheets</a>
      <a href="#/visual" data-page="visual"><span data-icon="image"></span>Visual Studio</a>
      <a href="#/settings" data-page="settings"><span data-icon="settings"></span>Settings</a>
      <a href="https://ymmiah.github.io/AutoMotoAI/GUI-GUIDE.html" id="helpLink" target="_blank" rel="noopener noreferrer" title="Step-by-step guide (opens in a new tab)"><span data-icon="info"></span>Help / Guide</a>
    </nav>
    <div class="conv-head">Chats</div>
    <div class="conv-list" id="convList" role="list" aria-label="Saved conversations"></div>
    <div class="side-foot">
      <span id="verLabel">v</span> · <a href="__SOURCE_URL__" id="sourceLink" target="_blank" rel="noopener" title="Source code (AGPL-3.0)">Source code</a> · <a href="https://github.com/ymmiah/AutoMotoAI/issues/new?template=report-content.yml" target="_blank" rel="noopener" title="Report harmful or inappropriate AI output">Report a problem</a>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSide" aria-label="Toggle sidebar (Ctrl+B)" title="Toggle sidebar (Ctrl+B)" data-icon="menu"></button>
      <h1 class="title" id="pageTitle">New chat</h1>
      <div class="top-actions">
        <button class="icon-btn" id="quickTheme" aria-label="Toggle light or dark theme" title="Toggle theme" data-icon="sun"></button>
        <a class="top-quick" id="switchLocation" href="automoto://switch-mode" title="Switch between local mode and cloud/server account" hidden><span data-icon="monitor"></span><span class="top-label">Local / Server</span></a>
        <a class="top-quick" href="#/files" title="Browse exported and workspace files"><span data-icon="folder"></span><span class="top-label">Files</span></a>
        <a class="top-quick" href="#/memory" title="Find saved memories"><span data-icon="brain"></span><span class="top-label">Memory</span></a>
        <div class="seg" role="radiogroup" aria-label="Mode" id="modeSeg">
          <button role="radio" data-mode="agent" aria-checked="true" title="Assistant: you write the request, it finishes the files and steps"><span data-icon="bolt"></span><span class="lbl">Assistant</span></button>
          <button role="radio" data-mode="chat" aria-checked="false" title="Chat: an answer only, no files or tools"><span data-icon="chat"></span><span class="lbl">Chat</span></button>
        </div>
        <label class="picker" title="Which AI answers first">
          <span class="sr">AI provider</span>
          <select id="providerPick" aria-label="AI provider"><option value="auto">Auto</option></select>
        </label>
        <button class="icon-btn" id="toggleInfo" aria-label="Toggle info panel" title="Info panel" data-icon="panel"></button>
      </div>
    </header>
    <section class="view" id="view" tabindex="-1"></section>
  </main>

  <aside class="info" id="info" aria-label="Task info" hidden>
    <div class="info-head"><b>Run info</b><button class="icon-btn" id="closeInfo" aria-label="Close info panel" data-icon="x"></button></div>
    <div class="info-body" id="infoBody"><p class="muted">Send a request to see progress here, in plain language.</p></div>
  </aside>
</div>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="palette-box">
    <label class="palette-input"><span data-icon="search"></span><input id="paletteInput" placeholder="Search chats or type a command…" aria-label="Command" autocomplete="off" /><kbd>Esc</kbd></label>
    <div class="palette-list" id="paletteList" role="listbox"></div>
  </div>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/chrome.js?v=__AUTOMOTO_VERSION__"></script>
<script type="module" src="/static/app.js?v=__AUTOMOTO_VERSION__"></script>
</body>
</html>
