<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="automoto-version" content="__AUTOMOTO_VERSION__" />
<meta name="color-scheme" content="dark light" />
<title>__BRAND__</title>
<meta name="automoto-brand" content="__BRAND__" />
<meta name="automoto-brand-short" content="__BRAND_SHORT__" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2338f2a5'/%3E%3Cpath d='M9 22l7-13 7 13M12 17h8' stroke='%230b0f14' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/app.css?v=__AUTOMOTO_VERSION__" />
<link rel="stylesheet" id="hljsTheme" href="/static/vendor/hljs-dark.css" />
<script src="/static/theme-boot.js?v=__AUTOMOTO_VERSION__"></script>
</head>
<body>
<a class="skip" href="#composerInput">Skip to message box</a>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="side-head">
      <a class="brand" href="#/new" aria-label="__BRAND__ home"><span class="logo" aria-hidden="true">A</span><span>__BRAND__</span></a>
      <button class="icon-btn only-mobile" id="closeSide" aria-label="Close sidebar" data-icon="x"></button>
    </div>
    <button class="new-chat" id="newChat" title="New chat (Ctrl+N or Ctrl+Shift+O)"><span data-icon="plus"></span>New chat<kbd>⌘N</kbd></button>
    <label class="search">
      <span data-icon="search"></span>
      <input id="convSearch" type="search" placeholder="Search chats" aria-label="Search conversations" autocomplete="off" />
      <kbd>⌘K</kbd>
    </label>
    <nav class="nav" aria-label="Pages">
      <a href="#/tasks" data-page="tasks"><span data-icon="activity"></span>Tasks<span class="badge" id="taskBadge" hidden></span></a>
      <a href="#/memory" data-page="memory"><span data-icon="brain"></span>Memory</a>
      <a href="#/routines" data-page="routines"><span data-icon="clock"></span>Routines</a>
      <a href="#/files" data-page="files"><span data-icon="folder"></span>Files</a>
      <a href="#/settings" data-page="settings"><span data-icon="settings"></span>Settings</a>
      <a href="https://ymmiah.github.io/AutoMotoAI/GUI-GUIDE.html" id="helpLink" target="_blank" rel="noopener noreferrer" title="Step-by-step guide (opens in a new tab)"><span data-icon="info"></span>Help / Guide</a>
    </nav>
    <div class="conv-head">Chats</div>
    <div class="conv-list" id="convList" role="list" aria-label="Saved conversations"></div>
    <div class="side-foot">
      <span id="verLabel">v</span> · <a href="https://github.com/ymmiah/AutoMotoAI" target="_blank" rel="noopener">GitHub</a>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSide" aria-label="Toggle sidebar (Ctrl+B)" title="Toggle sidebar (Ctrl+B)" data-icon="menu"></button>
      <h1 class="title" id="pageTitle">New chat</h1>
      <div class="top-actions">
        <div class="seg" role="radiogroup" aria-label="Mode" id="modeSeg">
          <button role="radio" data-mode="agent" aria-checked="true" title="Agent: uses tools step by step"><span data-icon="bolt"></span><span class="lbl">Agent</span></button>
          <button role="radio" data-mode="chat" aria-checked="false" title="Chat: plain answer, no tools"><span data-icon="chat"></span><span class="lbl">Chat</span></button>
        </div>
        <label class="picker" title="Which AI answers first">
          <span class="sr">AI provider</span>
          <select id="providerPick" aria-label="AI provider"><option value="auto">Auto</option></select>
        </label>
        <button class="icon-btn" id="toggleInfo" aria-label="Toggle info panel" title="Info panel" data-icon="panel"></button>
      </div>
    </header>
    <section class="view" id="view" tabindex="-1"></section>
  </main>

  <aside class="info" id="info" aria-label="Task info" hidden>
    <div class="info-head"><b>Run info</b><button class="icon-btn" id="closeInfo" aria-label="Close info panel" data-icon="x"></button></div>
    <div class="info-body" id="infoBody"><p class="muted">Start an agent run to see the provider, model and every step here.</p></div>
  </aside>
</div>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="palette-box">
    <label class="palette-input"><span data-icon="search"></span><input id="paletteInput" placeholder="Search chats or type a command…" aria-label="Command" autocomplete="off" /><kbd>Esc</kbd></label>
    <div class="palette-list" id="paletteList" role="listbox"></div>
  </div>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script type="module" src="/static/app.js?v=__AUTOMOTO_VERSION__"></script>
</body>
</html>
