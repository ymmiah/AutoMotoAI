<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Sign in · AutoMoto AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2338f2a5'/%3E%3Cpath d='M9 22l7-13 7 13M12 17h8' stroke='%230b0f14' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/app.css?v=__AUTOMOTO_VERSION__" />
<script src="/static/theme-boot.js?v=__AUTOMOTO_VERSION__"></script>
</head>
<body class="auth-body">
<main class="auth" aria-labelledby="authTitle">
  <div class="auth-brand"><span class="logo" aria-hidden="true">A</span><span>AutoMoto <b>AI</b></span></div>
  <h1 id="authTitle">Sign in</h1>
  <p class="muted" id="authLead">This AutoMoto server is shared. Sign in to use your own private workspace.</p>
  <div class="seg auth-tabs" role="tablist">
    <button role="tab" id="tabIn" aria-selected="true">Sign in</button>
    <button role="tab" id="tabUp" aria-selected="false">Create account</button>
  </div>
  <form id="authForm" autocomplete="on" novalidate>
    <label>Username<input class="input" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{2,31}" /></label>
    <label>Password<input class="input" name="password" type="password" autocomplete="current-password" required minlength="1" maxlength="256" /></label>
    <label id="inviteRow" hidden>Invite code<input class="input" name="invite" autocomplete="off" maxlength="100" placeholder="am-…" /></label>
    <p class="muted small" id="pwHint" hidden></p>
    <div class="auth-err" id="authErr" role="alert" hidden></div>
    <button class="btn primary wide" id="authBtn">Sign in</button>
  </form>
  <p class="muted small">Each account gets a daily usage allowance. Your chats and files are private to you.</p>
  <p class="muted small">v__AUTOMOTO_VERSION__ · <a href="https://github.com/ymmiah/AutoMotoAI" target="_blank" rel="noopener">AutoMoto AI on GitHub</a></p>
</main>
<script type="module" src="/static/login.js?v=__AUTOMOTO_VERSION__"></script>
</body>
</html>
